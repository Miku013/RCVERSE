<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>32x32 Pixel Art Studio - RC Icon Editor</title>
<style>
  :root {
    --bg-main: #18191c;
    --bg-panel: #242529;
    --bg-input: #2f3136;
    --border: #3c3f44;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --danger: #ef4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  body {
    background-color: var(--bg-main);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  /* Header */
  header {
    background: var(--bg-panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 52px;
  }
  .title-group {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .title-group h1 {
    font-size: 16px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .badge {
    background: var(--accent);
    color: #fff;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 4px;
    font-weight: 600;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  button {
    background: var(--bg-input);
    color: var(--text-main);
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s ease;
  }
  button:hover {
    background: #3a3d43;
    border-color: #555960;
  }
  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  button.primary:hover {
    background: var(--accent-hover);
  }

  /* Workspace */
  .workspace {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* Left Toolbar */
  .toolbar {
    width: 260px;
    background: var(--bg-panel);
    border-right: 1px solid var(--border);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .tools-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .tool-btn {
    padding: 8px;
    font-size: 12px;
    justify-content: flex-start;
  }
  .tool-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .tool-btn .key {
    margin-left: auto;
    font-size: 10px;
    opacity: 0.6;
    background: rgba(0,0,0,0.2);
    padding: 1px 4px;
    border-radius: 3px;
  }

  /* Options */
  .options-group {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 12px;
  }
  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }

  /* Color Section */
  .color-picker-box {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .color-inputs {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  input[type="color"] {
    -webkit-appearance: none;
    border: none;
    width: 44px;
    height: 36px;
    border-radius: 6px;
    cursor: pointer;
    background: none;
  }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 1px solid var(--border); border-radius: 6px; }
  .hex-input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: monospace;
    font-size: 13px;
  }
  .palette-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .palette-swatch {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .palette-swatch:hover {
    transform: scale(1.15);
    z-index: 1;
  }

  /* Main Canvas Area */
  .canvas-area {
    flex: 1;
    background: #121315;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .canvas-wrapper {
    position: relative;
    width: 512px;
    height: 512px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    cursor: crosshair;
    background: #fff;
    image-rendering: pixelated;
  }
  /* Checkerboard */
  .checker-bg {
    position: absolute;
    top: 0; left: 0;
    width: 512px; height: 512px;
    background-image: 
      linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
      linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
      linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
    background-size: 32px 32px;
    background-position: 0 0, 0 16px, 16px -16px, -16px 0px;
    pointer-events: none;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 512px; height: 512px;
    image-rendering: pixelated;
  }
  #gridCanvas {
    pointer-events: none;
  }
  #previewCanvas {
    pointer-events: none;
  }
  .canvas-footer {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 12px;
    color: var(--text-muted);
  }

  /* Right Sidebar (Layers & Preview) */
  .sidebar {
    width: 280px;
    background: var(--bg-panel);
    border-left: 1px solid var(--border);
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
  }
  .preview-card {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .preview-box {
    width: 64px;
    height: 64px;
    background: #333;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    background-image: 
      linear-gradient(45deg, #222 25%, transparent 25%), 
      linear-gradient(-45deg, #222 25%, transparent 25%), 
      linear-gradient(45deg, transparent 75%, #222 75%), 
      linear-gradient(-45deg, transparent 75%, #222 75%);
    background-size: 16px 16px;
    background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
  }
  #miniCanvas {
    width: 64px;
    height: 64px;
    image-rendering: pixelated;
  }

  /* Layer List */
  .layer-controls {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .layer-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 280px;
    overflow-y: auto;
  }
  .layer-item {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    font-size: 13px;
  }
  .layer-item.active {
    border-color: var(--accent);
    background: rgba(79, 70, 229, 0.15);
  }
  .layer-item .btn-icon {
    background: none;
    border: none;
    padding: 2px 4px;
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
  }
  .layer-item .btn-icon:hover {
    color: var(--text-main);
  }
  .layer-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Instructions */
  .hint-box {
    background: rgba(79, 70, 229, 0.08);
    border: 1px dashed rgba(79, 70, 229, 0.4);
    border-radius: 6px;
    padding: 10px;
    font-size: 11px;
    line-height: 1.5;
    color: #c7d2fe;
  }
</style>
</head>
<body>

<header>
  <div class="title-group">
    <h1>🎨 32x32 Pixel Art Studio</h1>
    <span class="badge">RC Icon Painter</span>
  </div>
  <div class="header-actions">
    <button onclick="undo()" title="直前の操作に戻す (Ctrl+Z)"><span id="undoLabel">↩ 元に戻す (5段階+)</span></button>
    <button onclick="redo()" title="やり直す (Ctrl+Y)">↪ やり直し</button>
    <button onclick="clearCurrentLayer()">🗑 レイヤー消去</button>
    <button onclick="loadTemplatePrompt()">📁 テンプレート読込</button>
    <button class="primary" onclick="export32PNG()" title="32x32サイズにリサイズして保存">💾 32x32 PNG保存</button>
    <button onclick="export512PNG()" title="512x512の拡大画像で保存">🖼 512x512 保存</button>
  </div>
</header>

<div class="workspace">
  <!-- Left Toolbar -->
  <div class="toolbar">
    <div>
      <div class="section-title">ツール</div>
      <div class="tools-grid">
        <button class="tool-btn active" id="btn-pencil" onclick="setTool('pencil')">✏️ ペン <span class="key">P</span></button>
        <button class="tool-btn" id="btn-eraser" onclick="setTool('eraser')">🧹 消しゴム <span class="key">E</span></button>
        <button class="tool-btn" id="btn-fill" onclick="setTool('fill')">🪣 塗りつぶし <span class="key">F</span></button>
        <button class="tool-btn" id="btn-line" onclick="setTool('line')">📏 直線 <span class="key">L</span></button>
        <button class="tool-btn" id="btn-rect" onclick="setTool('rect')">🔲 四角形 <span class="key">R</span></button>
        <button class="tool-btn" id="btn-curve" onclick="setTool('curve')">〰️ 曲線 <span class="key">C</span></button>
        <button class="tool-btn" id="btn-picker" onclick="setTool('picker')">🧪 スポイト <span class="key">I</span></button>
      </div>
    </div>

    <!-- Tool Options -->
    <div class="options-group">
      <div class="section-title" style="margin-bottom:0;">図形オプション</div>
      <label class="checkbox-label">
        <input type="checkbox" id="rectFilled" checked> 四角形を塗りつぶす
      </label>
      <div id="curveHint" style="display:none; color: #fbbf24; font-size:11px;">
        💡 曲線: 始点から終点までドラッグした後、クリックでカーブの頂点を決めます
      </div>
    </div>

    <!-- Color -->
    <div class="color-picker-box">
      <div class="section-title">カラー</div>
      <div class="color-inputs">
        <input type="color" id="colorPicker" value="#ffffff" onchange="setColor(this.value)">
        <input type="text" id="hexInput" class="hex-input" value="#FFFFFF" onchange="setColor(this.value)">
      </div>
      <div class="palette-grid" id="paletteGrid"></div>
    </div>

    <!-- Display Options -->
    <div class="options-group">
      <div class="section-title" style="margin-bottom:0;">グリッド表示</div>
      <label class="checkbox-label">
        <input type="checkbox" id="chkGrid" checked onchange="drawGrid()"> 1pxグリッド線 (16px幅)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkBlockGrid" checked onchange="drawGrid()"> 8マス区切り線 (青)
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="chkCenterLine" checked onchange="drawGrid()"> センター十字線 (赤)
      </label>
    </div>

    <div class="hint-box">
      <strong>ショートカット:</strong><br>
      • [Ctrl+Z]: アンドゥ (直前操作バック)<br>
      • [Ctrl+Y]: リドゥ<br>
      • [P/E/F/L/R/C/I]: ツール切り替え
    </div>
  </div>

  <!-- Center Canvas -->
  <div class="canvas-area">
    <div class="canvas-wrapper" id="canvasWrapper">
      <div class="checker-bg"></div>
      <canvas id="mainCanvas" width="512" height="512"></canvas>
      <canvas id="previewCanvas" width="512" height="512"></canvas>
      <canvas id="gridCanvas" width="512" height="512"></canvas>
    </div>
    <div class="canvas-footer">
      <span id="coordDisplay">X: --, Y: --</span>
      <span>解像度: 512×512 (実寸 32×32 ドット / 1マス 16px)</span>
    </div>
  </div>

  <!-- Right Sidebar -->
  <div class="sidebar">
    <div class="section-title">プレビュー (実寸 32x32)</div>
    <div class="preview-card">
      <div class="preview-box">
        <canvas id="miniCanvas" width="32" height="32"></canvas>
      </div>
      <span style="font-size:11px; color:var(--text-muted);">ゲーム内アイコン実寸サイズ</span>
    </div>

    <div>
      <div class="section-title">レイヤー管理</div>
      <div class="layer-controls">
        <button style="flex:1;" onclick="addLayer()">➕ 新規</button>
        <button onclick="moveLayerUp()">⬆ 上へ</button>
        <button onclick="moveLayerDown()">⬇ 下へ</button>
        <button onclick="deleteLayer()" style="color:var(--danger);">🗑</button>
      </div>
      <div class="layer-list" id="layerList"></div>
    </div>

    <div class="options-group">
      <div class="section-title" style="margin-bottom:0;">レイヤー不透明度</div>
      <div style="display:flex; align-items:center; gap:8px;">
        <input type="range" id="layerOpacity" min="0" max="100" value="100" style="flex:1;" oninput="changeOpacity(this.value)">
        <span id="opacityVal" style="font-size:11px; width:35px;">100%</span>
      </div>
    </div>
  </div>
</div>

<!-- Hidden File Input -->
<input type="file" id="fileInput" accept="image/png, image/jpeg" style="display:none;" onchange="handleImageFile(event)">

<script>
// --- Constants & Config ---
const GRID_SIZE = 32;       // 32x32 ドット
const CANVAS_PIXELS = 512;  // 512x512 表示
const CELL_SIZE = CANVAS_PIXELS / GRID_SIZE; // 16px per dot

// --- State ---
let currentTool = 'pencil';
let currentColor = '#ffffff';
let isDrawing = false;
let startX = -1, startY = -1;
let currentX = -1, currentY = -1;

// Curve Tool State: 0 = idle, 1 = start-end set, awaiting control point
let curveState = 0;
let curveP0 = {x:0, y:0}, curveP2 = {x:0, y:0};

// Layers: Array of { id, name, visible, opacity, data: Uint32Array(32*32) }
let layers = [];
let activeLayerIndex = 0;
let layerIdCounter = 1;

// History: 5段階以上の Undo/Redo バッファ (最大25ステップ)
const MAX_HISTORY = 25;
let undoStack = [];
let redoStack = [];

// DOM References
const mainCanvas = document.getElementById('mainCanvas');
const mainCtx = mainCanvas.getContext('2d');
const previewCanvas = document.getElementById('previewCanvas');
const previewCtx = previewCanvas.getContext('2d');
const gridCanvas = document.getElementById('gridCanvas');
const gridCtx = gridCanvas.getContext('2d');
const miniCanvas = document.getElementById('miniCanvas');
const miniCtx = miniCanvas.getContext('2d');

const colorPicker = document.getElementById('colorPicker');
const hexInput = document.getElementById('hexInput');
const coordDisplay = document.getElementById('coordDisplay');
const layerList = document.getElementById('layerList');
const layerOpacity = document.getElementById('layerOpacity');
const opacityVal = document.getElementById('opacityVal');
const rectFilled = document.getElementById('rectFilled');
const curveHint = document.getElementById('curveHint');

// Preset Color Palette
const DEFAULT_PALETTE = [
  '#000000', '#222222', '#555555', '#888888', '#aaaaaa', '#ffffff',
  '#b91c1c', '#ef4444', '#f87171', '#c2410c', '#f97316', '#fb923c',
  '#b45309', '#f59e0b', '#fbbf24', '#15803d', '#22c55e', '#4ade80',
  '#0369a1', '#0ea5e9', '#38bdf8', '#1d4ed8', '#3b82f6', '#60a5fa',
  '#4338ca', '#6366f1', '#818cf8', '#6b21a8', '#a855f7', '#c084fc',
  '#854d0e', '#a16207', '#ca8a04', '#451a03', '#78350f', '#92400e'
];

function init() {
  initPalette();
  addLayer("背景・ボディ");
  addLayer("枠線・ディテール");
  activeLayerIndex = 1;
  updateLayerUI();

  drawGrid();
  renderAll();
  saveHistory();

  setupEvents();
}

function initPalette() {
  const container = document.getElementById('paletteGrid');
  container.innerHTML = '';
  DEFAULT_PALETTE.forEach(color => {
    const swatch = document.createElement('div');
    swatch.className = 'palette-swatch';
    swatch.style.backgroundColor = color;
    swatch.onclick = () => setColor(color);
    container.appendChild(swatch);
  });
}

function setColor(hex) {
  if (!hex.startsWith('#')) hex = '#' + hex;
  currentColor = hex;
  colorPicker.value = hex;
  hexInput.value = hex.toUpperCase();
}

// --- History (Undo / Redo 5段階以上対応) ---
function cloneLayersState() {
  return layers.map(l => ({
    id: l.id,
    name: l.name,
    visible: l.visible,
    opacity: l.opacity,
    data: new Uint32Array(l.data)
  }));
}

function saveHistory() {
  undoStack.push({
    layers: cloneLayersState(),
    activeLayerIndex: activeLayerIndex
  });
  if (undoStack.length > MAX_HISTORY) {
    undoStack.shift();
  }
  redoStack = []; // Clear redo
}

function undo() {
  if (undoStack.length <= 1) return; // Keep initial
  const current = undoStack.pop();
  redoStack.push(current);

  const prev = undoStack[undoStack.length - 1];
  restoreHistoryState(prev);
}

function redo() {
  if (redoStack.length === 0) return;
  const next = redoStack.pop();
  undoStack.push(next);
  restoreHistoryState(next);
}

function restoreHistoryState(state) {
  layers = state.layers.map(l => ({
    id: l.id,
    name: l.name,
    visible: l.visible,
    opacity: l.opacity,
    data: new Uint32Array(l.data)
  }));
  activeLayerIndex = Math.min(state.activeLayerIndex, layers.length - 1);
  updateLayerUI();
  renderAll();
}

// --- Layer Operations ---
function addLayer(name) {
  const id = layerIdCounter++;
  const layer = {
    id: id,
    name: name || `レイヤー ${id}`,
    visible: true,
    opacity: 1.0,
    data: new Uint32Array(GRID_SIZE * GRID_SIZE) // 0 = transparent
  };
  layers.push(layer);
  activeLayerIndex = layers.length - 1;
  updateLayerUI();
  renderAll();
}

function deleteLayer() {
  if (layers.length <= 1) {
    alert("最後の1つのレイヤーは削除できません");
    return;
  }
  saveHistory();
  layers.splice(activeLayerIndex, 1);
  activeLayerIndex = Math.max(0, activeLayerIndex - 1);
  updateLayerUI();
  renderAll();
}

function moveLayerUp() {
  if (activeLayerIndex >= layers.length - 1) return;
  saveHistory();
  const tmp = layers[activeLayerIndex];
  layers[activeLayerIndex] = layers[activeLayerIndex + 1];
  layers[activeLayerIndex + 1] = tmp;
  activeLayerIndex++;
  updateLayerUI();
  renderAll();
}

function moveLayerDown() {
  if (activeLayerIndex <= 0) return;
  saveHistory();
  const tmp = layers[activeLayerIndex];
  layers[activeLayerIndex] = layers[activeLayerIndex - 1];
  layers[activeLayerIndex - 1] = tmp;
  activeLayerIndex--;
  updateLayerUI();
  renderAll();
}

function toggleLayerVisibility(idx, e) {
  e.stopPropagation();
  layers[idx].visible = !layers[idx].visible;
  updateLayerUI();
  renderAll();
}

function changeOpacity(val) {
  const current = layers[activeLayerIndex];
  if (!current) return;
  current.opacity = val / 100;
  opacityVal.innerText = val + "%";
  renderAll();
}

function clearCurrentLayer() {
  const current = layers[activeLayerIndex];
  if (!current) return;
  saveHistory();
  current.data.fill(0);
  renderAll();
}

function updateLayerUI() {
  layerList.innerHTML = '';
  // 最上位のレイヤーを一番上に表示 (Reverse)
  for (let i = layers.length - 1; i >= 0; i--) {
    const l = layers[i];
    const item = document.createElement('div');
    item.className = 'layer-item' + (i === activeLayerIndex ? ' active' : '');
    item.onclick = () => {
      activeLayerIndex = i;
      layerOpacity.value = Math.round(l.opacity * 100);
      opacityVal.innerText = layerOpacity.value + "%";
      updateLayerUI();
    };

    const eyeBtn = document.createElement('button');
    eyeBtn.className = 'btn-icon';
    eyeBtn.innerText = l.visible ? '👁️' : '🙈';
    eyeBtn.onclick = (e) => toggleLayerVisibility(i, e);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'layer-name';
    nameSpan.innerText = l.name;
    nameSpan.ondblclick = () => {
      const newName = prompt("レイヤー名変更:", l.name);
      if (newName) { l.name = newName; updateLayerUI(); }
    };

    item.appendChild(eyeBtn);
    item.appendChild(nameSpan);
    layerList.appendChild(item);
  }

  const current = layers[activeLayerIndex];
  if (current) {
    layerOpacity.value = Math.round(current.opacity * 100);
    opacityVal.innerText = layerOpacity.value + "%";
  }
}

// --- Color Helpers ---
function hexToUint32(hex) {
  let r = 0, g = 0, b = 0;
  if (hex.length === 7) {
    r = parseInt(hex.slice(1, 3), 16);
    g = parseInt(hex.slice(3, 5), 16);
    b = parseInt(hex.slice(5, 7), 16);
  }
  // Store as 0xAABBGGRR for Little Endian Uint32
  return (255 << 24) | (b << 16) | (g << 8) | r;
}

function uint32ToHex(val) {
  if (val === 0) return '#000000';
  const r = val & 0xFF;
  const g = (val >> 8) & 0xFF;
  const b = (val >> 16) & 0xFF;
  return "#" + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// --- Render Canvas (512x512 composite) ---
function renderAll() {
  mainCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
  miniCtx.clearRect(0, 0, 32, 32);

  // Composite layers in order
  for (let l of layers) {
    if (!l.visible || l.opacity <= 0) continue;

    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const val = l.data[y * GRID_SIZE + x];
        if (val === 0) continue; // transparent

        const hex = uint32ToHex(val);
        // Draw 16x16 block on main 512 canvas
        mainCtx.save();
        mainCtx.globalAlpha = l.opacity;
        mainCtx.fillStyle = hex;
        mainCtx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
        mainCtx.restore();

        // Draw 1px on mini 32 canvas
        miniCtx.save();
        miniCtx.globalAlpha = l.opacity;
        miniCtx.fillStyle = hex;
        miniCtx.fillRect(x, y, 1, 1);
        miniCtx.restore();
      }
    }
  }
}

// --- Grid Overlay ---
function drawGrid() {
  gridCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);

  const showGrid = document.getElementById('chkGrid').checked;
  const showBlock = document.getElementById('chkBlockGrid').checked;
  const showCenter = document.getElementById('chkCenterLine').checked;

  if (showGrid) {
    gridCtx.strokeStyle = 'rgba(0, 0, 0, 0.15)';
    gridCtx.lineWidth = 1;
    for (let i = 0; i <= GRID_SIZE; i++) {
      gridCtx.beginPath();
      gridCtx.moveTo(i * CELL_SIZE, 0);
      gridCtx.lineTo(i * CELL_SIZE, CANVAS_PIXELS);
      gridCtx.stroke();

      gridCtx.beginPath();
      gridCtx.moveTo(0, i * CELL_SIZE);
      gridCtx.lineTo(CANVAS_PIXELS, i * CELL_SIZE);
      gridCtx.stroke();
    }
  }

  if (showBlock) {
    gridCtx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
    gridCtx.lineWidth = 2;
    for (let i = 0; i <= GRID_SIZE; i += 8) {
      gridCtx.beginPath();
      gridCtx.moveTo(i * CELL_SIZE, 0);
      gridCtx.lineTo(i * CELL_SIZE, CANVAS_PIXELS);
      gridCtx.stroke();

      gridCtx.beginPath();
      gridCtx.moveTo(0, i * CELL_SIZE);
      gridCtx.lineTo(CANVAS_PIXELS, i * CELL_SIZE);
      gridCtx.stroke();
    }
  }

  if (showCenter) {
    gridCtx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
    gridCtx.lineWidth = 2;
    const mid = (GRID_SIZE / 2) * CELL_SIZE;
    gridCtx.beginPath();
    gridCtx.moveTo(mid, 0);
    gridCtx.lineTo(mid, CANVAS_PIXELS);
    gridCtx.stroke();

    gridCtx.beginPath();
    gridCtx.moveTo(0, mid);
    gridCtx.lineTo(CANVAS_PIXELS, mid);
    gridCtx.stroke();
  }
}

// --- Tool Selection ---
function setTool(tool) {
  currentTool = tool;
  curveState = 0;
  previewCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
  document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('active'));
  const btn = document.getElementById(`btn-${tool}`);
  if (btn) btn.classList.add('active');

  curveHint.style.display = (tool === 'curve') ? 'block' : 'none';
}

// --- Drawing Algorithms ---
function getActiveLayerData() {
  const current = layers[activeLayerIndex];
  if (!current || !current.visible) return null;
  return current.data;
}

function setPixel(x, y, colorHex) {
  if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return;
  const data = getActiveLayerData();
  if (!data) return;
  data[y * GRID_SIZE + x] = (colorHex === null) ? 0 : hexToUint32(colorHex);
}

function getPixel(x, y) {
  if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) return 0;
  const data = getActiveLayerData();
  if (!data) return 0;
  return data[y * GRID_SIZE + x];
}

// Bresenham Line
function drawLinePoints(x0, y0, x1, y1) {
  const pts = [];
  const dx = Math.abs(x1 - x0);
  const dy = Math.abs(y1 - y0);
  const sx = (x0 < x1) ? 1 : -1;
  const sy = (y0 < y1) ? 1 : -1;
  let err = dx - dy;

  let x = x0, y = y0;
  while (true) {
    pts.push({x, y});
    if (x === x1 && y === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x += sx; }
    if (e2 < dx) { err += dx; y += sy; }
  }
  return pts;
}

// Quadratic Bezier Curve Points
function drawCurvePoints(p0, p1, p2) {
  const pts = [];
  const steps = 40;
  let lastX = -1, lastY = -1;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const u = 1 - t;
    const x = Math.round(u * u * p0.x + 2 * u * t * p1.x + t * t * p2.x);
    const y = Math.round(u * u * p0.y + 2 * u * t * p1.y + t * t * p2.y);
    if (x >= 0 && x < GRID_SIZE && y >= 0 && y < GRID_SIZE) {
      if (lastX !== -1) {
        // 間を線で繋いで隙間を埋める
        const linePts = drawLinePoints(lastX, lastY, x, y);
        pts.push(...linePts);
      } else {
        pts.push({x, y});
      }
      lastX = x; lastY = y;
    }
  }
  return pts;
}

// Rectangle Points
function drawRectPoints(x0, y0, x1, y1, filled) {
  const pts = [];
  const minX = Math.min(x0, x1);
  const maxX = Math.max(x0, x1);
  const minY = Math.min(y0, y1);
  const maxY = Math.max(y0, y1);

  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      if (filled || x === minX || x === maxX || y === minY || y === maxY) {
        pts.push({x, y});
      }
    }
  }
  return pts;
}

// Flood Fill (バケツ塗り)
function floodFill(startX, startY, targetHex) {
  const data = getActiveLayerData();
  if (!data) return;
  const targetVal = hexToUint32(targetHex);
  const originalVal = getPixel(startX, startY);
  if (originalVal === targetVal) return;

  const queue = [{x: startX, y: startY}];
  const visited = new Uint8Array(GRID_SIZE * GRID_SIZE);

  while (queue.length > 0) {
    const {x, y} = queue.pop();
    const idx = y * GRID_SIZE + x;
    if (x < 0 || x >= GRID_SIZE || y < 0 || y >= GRID_SIZE) continue;
    if (visited[idx]) continue;
    visited[idx] = 1;

    if (data[idx] === originalVal) {
      data[idx] = targetVal;
      queue.push({x: x + 1, y: y});
      queue.push({x: x - 1, y: y});
      queue.push({x: x, y: y + 1});
      queue.push({x: x, y: y - 1});
    }
  }
}

// --- Preview Overlay ---
function showPreviewPoints(points, colorHex) {
  previewCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
  previewCtx.fillStyle = colorHex || currentColor;
  for (let pt of points) {
    previewCtx.fillRect(pt.x * CELL_SIZE, pt.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
  }
}

// --- Mouse / Pointer Events ---
function setupEvents() {
  const wrapper = document.getElementById('canvasWrapper');

  wrapper.addEventListener('mousedown', (e) => {
    const pos = getGridCoord(e);
    if (!pos) return;
    startX = pos.x; startY = pos.y;
    currentX = pos.x; currentY = pos.y;
    isDrawing = true;

    if (currentTool === 'pencil') {
      saveHistory();
      setPixel(pos.x, pos.y, currentColor);
      renderAll();
    } else if (currentTool === 'eraser') {
      saveHistory();
      setPixel(pos.x, pos.y, null);
      renderAll();
    } else if (currentTool === 'fill') {
      saveHistory();
      floodFill(pos.x, pos.y, currentColor);
      renderAll();
    } else if (currentTool === 'picker') {
      const val = getPixel(pos.x, pos.y);
      if (val !== 0) setColor(uint32ToHex(val));
      setTool('pencil');
    } else if (currentTool === 'curve') {
      if (curveState === 1) {
        // Second step: Control point click -> finalize curve!
        saveHistory();
        const pts = drawCurvePoints(curveP0, {x: pos.x, y: pos.y}, curveP2);
        for (let pt of pts) setPixel(pt.x, pt.y, currentColor);
        previewCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
        curveState = 0;
        isDrawing = false;
        renderAll();
      }
    }
  });

  window.addEventListener('mousemove', (e) => {
    const pos = getGridCoord(e);
    if (pos) {
      coordDisplay.innerText = `X: ${pos.x}, Y: ${pos.y}`;
      currentX = pos.x; currentY = pos.y;
    }

    if (!isDrawing) {
      // Hover preview highlight
      if (pos && currentTool !== 'curve') {
        previewCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
        previewCtx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
        previewCtx.lineWidth = 2;
        previewCtx.strokeRect(pos.x * CELL_SIZE, pos.y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
      }
      if (currentTool === 'curve' && curveState === 1 && pos) {
        // Curve control point preview
        const pts = drawCurvePoints(curveP0, {x: pos.x, y: pos.y}, curveP2);
        showPreviewPoints(pts, currentColor);
      }
      return;
    }

    if (!pos) return;

    if (currentTool === 'pencil') {
      setPixel(pos.x, pos.y, currentColor);
      renderAll();
    } else if (currentTool === 'eraser') {
      setPixel(pos.x, pos.y, null);
      renderAll();
    } else if (currentTool === 'line') {
      const pts = drawLinePoints(startX, startY, pos.x, pos.y);
      showPreviewPoints(pts, currentColor);
    } else if (currentTool === 'rect') {
      const isFilled = rectFilled.checked;
      const pts = drawRectPoints(startX, startY, pos.x, pos.y, isFilled);
      showPreviewPoints(pts, currentColor);
    } else if (currentTool === 'curve' && curveState === 0) {
      // First drag: straight line to choose start & end
      const pts = drawLinePoints(startX, startY, pos.x, pos.y);
      showPreviewPoints(pts, currentColor);
    }
  });

  window.addEventListener('mouseup', (e) => {
    if (!isDrawing) return;
    const pos = getGridCoord(e) || {x: currentX, y: currentY};

    if (currentTool === 'line') {
      saveHistory();
      const pts = drawLinePoints(startX, startY, pos.x, pos.y);
      for (let pt of pts) setPixel(pt.x, pt.y, currentColor);
      previewCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
      renderAll();
    } else if (currentTool === 'rect') {
      saveHistory();
      const isFilled = rectFilled.checked;
      const pts = drawRectPoints(startX, startY, pos.x, pos.y, isFilled);
      for (let pt of pts) setPixel(pt.x, pt.y, currentColor);
      previewCtx.clearRect(0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
      renderAll();
    } else if (currentTool === 'curve') {
      if (curveState === 0) {
        curveP0 = {x: startX, y: startY};
        curveP2 = {x: pos.x, y: pos.y};
        curveState = 1; // Waiting for control point
      }
    }

    if (currentTool !== 'curve') {
      isDrawing = false;
    } else if (curveState === 1) {
      isDrawing = false; // pause drag, wait for control point click
    }
  });

  // Keyboard Shortcuts
  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      e.preventDefault();
      undo();
    } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
      e.preventDefault();
      redo();
    } else if (e.key.toLowerCase() === 'p') setTool('pencil');
    else if (e.key.toLowerCase() === 'e') setTool('eraser');
    else if (e.key.toLowerCase() === 'f') setTool('fill');
    else if (e.key.toLowerCase() === 'l') setTool('line');
    else if (e.key.toLowerCase() === 'r') setTool('rect');
    else if (e.key.toLowerCase() === 'c') setTool('curve');
    else if (e.key.toLowerCase() === 'i') setTool('picker');
  });
}

function getGridCoord(e) {
  const rect = mainCanvas.getBoundingClientRect();
  const clientX = e.clientX;
  const clientY = e.clientY;
  if (clientX < rect.left || clientX >= rect.right || clientY < rect.top || clientY >= rect.bottom) {
    return null;
  }
  const x = Math.floor((clientX - rect.left) / (rect.width / GRID_SIZE));
  const y = Math.floor((clientY - rect.top) / (rect.height / GRID_SIZE));
  return {x: Math.max(0, Math.min(GRID_SIZE - 1, x)), y: Math.max(0, Math.min(GRID_SIZE - 1, y))};
}

// --- Export Functions ---
// 1. 32x32 PNG保存 (ゲーム用実寸アイコン)
function export32PNG() {
  const outCanvas = document.createElement('canvas');
  outCanvas.width = GRID_SIZE;
  outCanvas.height = GRID_SIZE;
  const outCtx = outCanvas.getContext('2d');

  for (let l of layers) {
    if (!l.visible || l.opacity <= 0) continue;
    for (let y = 0; y < GRID_SIZE; y++) {
      for (let x = 0; x < GRID_SIZE; x++) {
        const val = l.data[y * GRID_SIZE + x];
        if (val === 0) continue;
        outCtx.save();
        outCtx.globalAlpha = l.opacity;
        outCtx.fillStyle = uint32ToHex(val);
        outCtx.fillRect(x, y, 1, 1);
        outCtx.restore();
      }
    }
  }

  downloadCanvas(outCanvas, 'icon_32x32.png');
}

// 2. 512x512 PNG保存 (高解像度プレビュー・配信用)
function export512PNG() {
  const outCanvas = document.createElement('canvas');
  outCanvas.width = CANVAS_PIXELS;
  outCanvas.height = CANVAS_PIXELS;
  const outCtx = outCanvas.getContext('2d');
  outCtx.imageSmoothingEnabled = false;

  // Mini canvas をクッキリ拡大描画
  outCtx.drawImage(miniCanvas, 0, 0, CANVAS_PIXELS, CANVAS_PIXELS);
  downloadCanvas(outCanvas, 'icon_512x512.png');
}

function downloadCanvas(canvas, filename) {
  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

// --- Template Loader ---
function loadTemplatePrompt() {
  document.getElementById('fileInput').click();
}

function handleImageFile(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (event) => {
    const img = new Image();
    img.onload = () => {
      saveHistory();
      addLayer(file.name.replace(/\.[^/.]+$/, ""));
      const current = layers[activeLayerIndex];

      // Draw onto 32x32 temporary canvas
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = GRID_SIZE;
      tempCanvas.height = GRID_SIZE;
      const tCtx = tempCanvas.getContext('2d');
      tCtx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);

      const imgData = tCtx.getImageData(0, 0, GRID_SIZE, GRID_SIZE).data;
      for (let y = 0; y < GRID_SIZE; y++) {
        for (let x = 0; x < GRID_SIZE; x++) {
          const idx = (y * GRID_SIZE + x) * 4;
          const a = imgData[idx + 3];
          if (a > 30) {
            const r = imgData[idx];
            const g = imgData[idx + 1];
            const b = imgData[idx + 2];
            current.data[y * GRID_SIZE + x] = (255 << 24) | (b << 16) | (g << 8) | r;
          } else {
            current.data[y * GRID_SIZE + x] = 0;
          }
        }
      }
      renderAll();
      e.target.value = ''; // reset
    };
    img.src = event.target.result;
  };
  reader.readAsDataURL(file);
}

// Start
window.onload = init;
</script>
